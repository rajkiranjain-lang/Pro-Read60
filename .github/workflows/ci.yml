name: CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pro_read60?schema=public
      AUTH_SECRET: ci-only-secret-do-not-use-in-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      STORAGE_BUCKET: ""
      STORAGE_ACCESS_KEY: ""
      STORAGE_SECRET_KEY: ""
      EMAIL_PROVIDER: console
      EMAIL_API_KEY: ""
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
